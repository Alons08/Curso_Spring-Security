<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
                xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <meta charset="UTF-8">
    <title>Listado de personas</title>
</head>

<body>
    <div align="center">
        <!--Los 2 siguientes son para lo de Spring Security-->
        <div sec:authorize="isAuthenticated()">
            <p th:inline="text">Bienvenido <span sec:authentication="name"></span></p>
            <form th:action="@{/logout}" method="post">
                <input type="submit" value="Cerrar Sesión"/>
            </form>
        </div>
        <div sec:authorize="isAnonymous()">
            <p>Bienvenido visitante</p>
            <a th:href="@{/login}">Iniciar sesión</a>
        </div>

        <h1>Listado de personas</h1>
        <table border="1" cellpadding="10">
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Edad</th>
                <th sec:authorize="hasRole('ADMIN')">Acciones</th>
            </tr>
            <tr th:each="persona : ${listaPersonas}">
                <td th:text="${persona.id}"></td>
                <td th:text="${persona.nombre}"></td>
                <td th:text="${persona.edad}"></td>
                <td sec:authorize="hasRole('ADMIN')">
                    <!--           la url(el id tiene el valor de)-->
                    <a th:href="@{/personas/editar/{id}(id=${persona.id})}">Editar</a>
                    <a th:href="@{/personas/eliminar/{id}(id=${persona.id})}">Eliminar</a>
                </td>
            </tr>
        </table>

        <div sec:authorize="hasAnyRole('ADMIN','USER')">
            <a href="/personas/nuevo">Nueva persona</a>
        </div>
    </div>
</body>
</html>
